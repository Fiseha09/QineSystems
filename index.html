<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Qine Systems...</title>
    <!-- Inter Font -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1E1B4B;
            --bg-mid: #312E81;
            --cyan: #06B6D4;
            --gold: #F59E0B;
            --text-light: #F9FAFB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-mid) 50%, var(--bg-dark) 100%);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glowing background nodes */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--cyan);
            opacity: 0.05;
            filter: blur(80px);
            animation: pulse 8s infinite alternate;
        }
        body::before { top: 10%; left: 10%; }
        body::after { bottom: 10%; right: 10%; background: var(--gold); }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.03; }
            100% { transform: scale(1.2); opacity: 0.07; }
        }

        /* Floating Code Syntax (The Wax) */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
            color: var(--cyan);
            opacity: 0.15;
            animation: floatUp 6s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.25; }
            90% { opacity: 0.25; }
            100% { transform: translateY(-5vh) rotate(360deg); opacity: 0; }
        }

        /* Container & Philosophy Card */
        .redirect-container {
            text-align: center;
            z-index: 2;
            padding: 2rem;
            max-width: 480px;
            width: 90%;
        }

        /* The Animated Logo/Brand Mark */
        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .brand-title {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        /* Sem n' Werq Subtitle Translation */
        .philosophy-tag {
            font-size: 0.85rem;
            font-family: 'Fira Code', monospace;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.3s;
        }

        /* The Custom Loading Architecture (The Logic Bar) */
        .loader-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
        }

        .loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--gold));
            box-shadow: 0 0 12px var(--cyan);
            border-radius: 10px;
            animation: loadProgress 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            30% { width: 45%; }
            70% { width: 75%; }
            100% { width: 100%; }
        }

        /* System Messages */
        .status-text {
            font-size: 0.95rem;
            color: #9CA3AF;
            margin-bottom: 0.5rem;
        }

        .status-text span {
            color: var(--cyan);
            font-family: 'Fira Code', monospace;
        }

        .fallback-text {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #6B7280;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards 1.5s;
        }

        .fallback-text a {
            color: var(--cyan);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .fallback-text a:hover {
            color: var(--gold);
            text-decoration: underline;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Floating syntax pieces contextually scaling across the canvas -->
    <div class="particles" id="particle-canvas"></div>

    <div class="redirect-container">
        <div class="logo-wrapper">
            <h1 class="brand-title">Qine Systems</h1>
            <div class="philosophy-tag">ስም እና ወርቅ &bull; Wax & Gold</div>
        </div>
        <img src="QineSystem-Logo.jpg" alt="Qine Systems Logo" style="width: 80px; height: 80px; border-radius: 50%; margin-bottom: 1.5rem; box-shadow: 0 0 12px var(--cyan);">

        <!-- Progress engine -->
        <div class="loader-track">
            <div class="loader-bar"></div>
        </div>

        <div class="status-text">
            Compiling syntax, uncovering <span>logic...</span>
        </div>

        <div class="fallback-text">
            Stuck? <a href="pages/home.html">Execute manual override</a>.
        </div>
    </div>

    <script>
        // Target path
        const destination = "pages/home.html";

        // 1. Generate programmatic syntax debris (Floating elements)
        const syntaxElements = ['{ }', '</>', '[ ]', '( )', '=>', 'import', 'async', '@@'];
        const canvas = document.getElementById('particle-canvas');
        
        for (let i = 0; i < 15; i++) {
            const span = document.createElement('span');
            span.className = 'particle';
            span.textContent = syntaxElements[Math.floor(Math.random() * syntaxElements.length)];
            
            // Randomize position, size, and timings
            span.style.left = Math.random() * 100 + 'vw';
            span.style.animationDelay = Math.random() * 5 + 's';
            span.style.animationDuration = 4 + Math.random() * 4 + 's';
            span.style.fontSize = 0.8 + Math.random() * 0.8 + 'rem';
            
            // Alternate colors between Cyan and Gold accents
            if(Math.random() > 0.6) {
                span.style.color = '#F59E0B'; 
            }
            
            canvas.appendChild(span);
        }

        // 2. Change dynamic status messages inside the 3-second window
        const statusNode = document.querySelector('.status-text');
        setTimeout(() => {
            statusNode.innerHTML = "Rendering flawless <span>interface (Wax)...</span>";
        }, 1000);
        
        setTimeout(() => {
            statusNode.innerHTML = "Deploying stable <span>computational logic (Gold)...</span>";
        }, 2000);

        // 3. Perform seamless client-side handoff at 3 seconds
        setTimeout(() => {
            window.location.href = destination;
        }, 3000);
    </script>
</body>
</html>
